<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>CarData Explorer | Professional Database</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="loading-overlay" class="hidden"><span class="loader"></span></div>

    <!-- Mobile Drawer Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <div id="layout">
        <!-- Sidebar Drawer -->
        <aside id="sidebar">
            <div class="brand">
                <div class="brand-wrapper">
                    <div class="brand-icon-container">
                        <i data-lucide="car" class="brand-icon"></i>
                    </div>
                    <h1>CarData Explorer</h1>
                </div>
                <div class="brand-actions">
                    <button id="theme-btn" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                        <i data-lucide="moon" class="theme-icon"></i>
                    </button>
                    <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Close filter drawer">
                        <i data-lucide="x"></i>
                    </button>
                </div>
            </div>

            <div class="filter-section">
                <!-- Simple Filtering Section -->
                <div class="filter-group">
                    <div class="filter-group-header">
                        <label>Simple Filtering</label>
                        <button type="button" id="reset-filters-btn" class="reset-filters-btn">Reset</button>
                    </div>
                    <select id="make-select" aria-label="Select Manufacturer">
                        <option value="">All Manufacturers</option>
                    </select>
                    <select id="model-select" disabled aria-label="Select Model">
                        <option value="">Select Manufacturer first</option>
                    </select>
                    <select id="trim-select" disabled aria-label="Select Trim">
                        <option value="">Select Model first</option>
                    </select>
                </div>

                <div class="filter-divider"></div>

                <!-- Advanced Filtering Section -->
                <div class="filter-group">
                    <label for="search-input">Keyword Search</label>
                    <input type="text" id="search-input" placeholder="Search anything...">
                </div>

                <div class="filter-group">
                    <label>Release Year</label>
                    <div class="range-grid">
                        <select id="year-min" aria-label="Minimum Year">
                            <option value="">Min</option>
                        </select>
                        <select id="year-max" aria-label="Maximum Year">
                            <option value="">Max</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group">
                    <div class="switch-row">
                        <label class="switch">
                            <input type="checkbox" id="us-only">
                            <span class="slider"></span>
                        </label>
                        <label for="us-only" class="switch-label">Show Only US Models</label>
                    </div>
                </div>

                <!-- More Advanced Filters -->
                <div class="filter-group">
                    <label for="body-style">Body Style</label>
                    <select id="body-style">
                        <option value="">Any Body Style</option>
                        <option value="Sedan">Sedan</option>
                        <option value="Coupe">Coupe</option>
                        <option value="SUV">SUV</option>
                        <option value="Pickup">Pickup</option>
                        <option value="Convertible">Convertible</option>
                        <option value="Wagon">Wagon</option>
                        <option value="Hatchback">Hatchback</option>
                        <option value="Minivan">Minivan</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="apply-filters-btn" class="apply-filters-btn" type="button">
                    <span>Show Results</span>
                </button>
                <nav class="nav-links" aria-label="Sidebar navigation">
                    <button class="nav-btn active" data-view="tree-view">
                        <i data-lucide="layers" class="nav-icon"></i>
                        <span>Tree Browser</span>
                    </button>
                    <button class="nav-btn" data-view="grid-view">
                        <i data-lucide="layout-grid" class="nav-icon"></i>
                        <span>Card Explorer</span>
                    </button>
                    <button class="nav-btn" data-view="list-view">
                        <i data-lucide="table" class="nav-icon"></i>
                        <span>Data Table</span>
                    </button>
                </nav>
                <a href="https://github.com/imamhossain94/cardata-explorer" class="github-btn" target="_blank" rel="noopener">
                    <i data-lucide="github" class="nav-icon"></i>
                    <span>GitHub Repository</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main>
            <header class="main-header">
                <div class="header-top-row">
                    <div class="header-title-area">
                        <button id="mobile-filter-btn" class="mobile-filter-btn" aria-label="Open Filters">
                            <i data-lucide="sliders-horizontal" class="filter-icon"></i>
                            <span class="filter-text">Filters</span>
                            <span id="active-filter-badge" class="filter-badge hidden">0</span>
                        </button>
                        <div class="title-meta">
                            <h2>Universal Database</h2>
                            <p id="result-count">Initializing engine...</p>
                        </div>
                    </div>
                    <div class="header-actions">
                        <div class="view-segmented-control" role="group" aria-label="View selection">
                            <button class="nav-btn active" data-view="tree-view" title="Tree Browser" aria-label="Tree Browser">
                                <i data-lucide="layers" class="nav-icon"></i>
                                <span class="segmented-label">Tree</span>
                            </button>
                            <button class="nav-btn" data-view="grid-view" title="Card Explorer" aria-label="Card Explorer">
                                <i data-lucide="layout-grid" class="nav-icon"></i>
                                <span class="segmented-label">Cards</span>
                            </button>
                            <button class="nav-btn" data-view="list-view" title="Data Table" aria-label="Data Table">
                                <i data-lucide="table" class="nav-icon"></i>
                                <span class="segmented-label">Table</span>
                            </button>
                        </div>
                        <button id="header-theme-btn" class="theme-toggle header-theme-btn" aria-label="Toggle theme" title="Toggle theme">
                            <i data-lucide="moon" class="theme-icon"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="content-body">
                <!-- Views -->
                <section id="tree-view" class="view-content">
                    <div id="tree-root"></div>
                </section>

                <section id="grid-view" class="view-content hidden">
                    <div id="car-grid" class="grid"></div>
                </section>

                <section id="list-view" class="view-content hidden">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Manufacturer</th>
                                    <th>Model Name</th>
                                    <th>Year</th>
                                    <th>Variant</th>
                                    <th style="text-align:right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="car-table-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span class="card-badge">Specifications</span>
                    <h2 id="modal-title">Car Details</h2>
                </div>
                <button id="close-modal" class="close-modal-btn" aria-label="Close modal"><i data-lucide="x"></i></button>
            </div>
            <div id="specs-root" class="specs-grid"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
